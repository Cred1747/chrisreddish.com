<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="50%" style="stop-color:#1e293b"/>
      <stop offset="100%" style="stop-color:#0f172a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee"/>
      <stop offset="50%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#a855f7"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="627" fill="url(#bg)"/>
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="200" fill="#22d3ee" opacity="0.05"/>
  <circle cx="1100" cy="527" r="250" fill="#a855f7" opacity="0.05"/>
  
  <!-- Name -->
  <text x="600" y="220" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="url(#textGrad)">Chris Reddish</text>
  
  <!-- Title -->
  <text x="600" y="290" text-anchor="middle" font-family="Arial, sans-serif" font-size="32" fill="#94a3b8">Data &amp; AI Analytics Engineer</text>
  
  <!-- Tags background -->
  <rect x="120" y="340" rx="25" ry="25" width="220" height="50" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3"/>
  <rect x="360" y="340" rx="25" ry="25" width="180" height="50" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3"/>
  <rect x="560" y="340" rx="25" ry="25" width="240" height="50" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3"/>
  <rect x="820" y="340" rx="25" ry="25" width="200" height="50" fill="#22d3ee" fill-opacity="0.15" stroke="#22d3ee" stroke-opacity="0.3"/>
  
  <!-- Tag text -->
  <text x="230" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee">📊 Looker &amp; BigQuery</text>
  <text x="450" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee">🤖 AI Agents</text>
  <text x="680" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee">📈 Data Visualization</text>
  <text x="920" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#22d3ee">🔬 NLP Research</text>
  
  <!-- URL -->
  <text x="600" y="500" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" fill="#64748b">chrisreddish.com</text>
  
  <!-- Bottom accent line -->
  <rect x="400" y="540" width="400" height="4" rx="2" fill="url(#textGrad)"/>
</svg>
